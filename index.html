<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Endless Narrative - Home</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; display: flex; min-height: 100vh; background-color: #f4f4f9; }
        
        /* Sidebar Styles */
        .sidebar { width: 20%; background-color: #2c3e50; color: white; padding: 20px; transition: 0.3s; position: relative; }
        .sidebar h2 { margin-top: 0; }
        .menu-list { list-style: none; padding: 0; }
        .menu-list li { padding: 10px 0; border-bottom: 1px solid #34495e; cursor: pointer; }
        .menu-list li:hover { color: #3498db; }
        
        /* Search Bar Styles */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-container input { width: 100%; padding: 10px; border-radius: 5px; border: none; }
        .search-results { display: none; position: absolute; background: white; color: black; width: 100%; max-height: 300px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .search-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .search-item:hover { background-color: #f0f0f0; }

        /* Main Content */
        .main-content { width: 80%; padding: 20px; overflow-y: auto; }
        .mobile-toggle { display: none; background: #3498db; color: white; border: none; padding: 10px; cursor: pointer; margin-bottom: 20px; }
        
        /* AdSense Placeholders */
        .ad-container { width: 100%; height: 90px; background: #ddd; display: flex; align-items: center; justify-content: center; margin: 20px 0; border: 1px dashed #999; color: #666; font-weight: bold; }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; display: none; }
            .sidebar.active { display: block; }
            .main-content { width: 100%; }
            .mobile-toggle { display: block; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <h2>Menu</h2>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search characters, stories...">
            <div class="search-results" id="searchResults"></div>
        </div>
        <ul class="menu-list">
            <li>Home</li>
            <li>Character Descriptions</li>
            <li>Narrative/Stories</li>
            <li>Other Descriptions</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <button class="mobile-toggle" onclick="toggleMenu()">☰ Menu / Search</button>
        
        <!-- AdSense 1 -->
        <div class="ad-container">AdSense Placeholder 1 (728x90)</div>

        <h1>Welcome to The Endless Narrative</h1>
        <p>Use the sidebar to search for character descriptions or browse the chapters of the story.</p>

        <!-- AdSense 2 -->
        <div class="ad-container">AdSense Placeholder 2 (728x90)</div>
    </div>

    <!-- Scripts -->
    <script src="searchData.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
        }
        // Initialize search from searchData.js
        setupSearch();
    </script>
</body>
</html>
